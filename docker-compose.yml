services:
  postgres:
    image: postgres:16-alpine
    container_name: modelgate-postgres
    environment:
      POSTGRES_USER: modelgate
      POSTGRES_PASSWORD: modelgate
      POSTGRES_DB: modelgate
    ports:
      - "15435:5432"
    volumes:
      - modelgate-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modelgate -d modelgate"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: modelgate-redis
    ports:
      - "16381:6379"
    volumes:
      - modelgate-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  modelgate-pgdata:
  modelgate-redisdata:
